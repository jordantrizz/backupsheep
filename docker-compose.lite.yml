services:
  app:
    image: backupsheep
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_TIER: lite
      APP_PROCESS: web
      RUN_MIGRATIONS: "true"
      ENABLE_ASYNC_WORKERS: "false"
      APP_DB_BACKEND: sqlite
      APP_CACHE_BACKEND: locmem
      SQLITE_PATH: /data/backupsheep.sqlite3
      DJANGO_SERVER: dev
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: change-this-key
      APP_DOMAIN: localhost:8000
      APP_PROTOCOL: http://
      APP_NAME: BackupSheep
    ports:
      - "8000:80"
    volumes:
      - backupsheep_sqlite:/data
    restart: unless-stopped

volumes:
  backupsheep_sqlite: