services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: backupsheep
      POSTGRES_USER: backupsheep
      POSTGRES_PASSWORD: backupsheep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    image: backupsheep
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DJANGO_SERVER: dev
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: change-this-key
      APP_DOMAIN: localhost:8000
      APP_PROTOCOL: http://
      APP_NAME: BackupSheep
      DB_NAME: backupsheep
      DB_USER: backupsheep
      DB_PASSWORD: backupsheep
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:80"
    restart: unless-stopped

volumes:
  postgres_data:
